{% extends 'base.html' %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Edit Category</h1>
        <p>Update category information</p>
    </div>

    <a href="{% url 'category_list' %}" class="btn-secondary">
        ← Back to Categories
    </a>

</div>


<div class="form-card">

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label for="name">
                Category Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ category.name }}"
                placeholder="Enter category name"
                required
            >

        </div>


        <div class="form-group">

            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                name="description"
                rows="5"
                placeholder="Enter category description"
            >{{ category.description }}</textarea>

        </div>


        <div class="form-actions">

            <a
                href="{% url 'category_list' %}"
                class="btn-cancel"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="btn-primary"
            >
                Update Category
            </button>

        </div>

    </form>

</div>


<style>

.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.page-header h1 {
    margin: 0;
    font-size: 28px;
}

.page-header p {
    margin-top: 6px;
    color: #6b7280;
}

.btn-secondary {
    display: inline-block;
    padding: 10px 16px;
    background: #f3f4f6;
    color: #374151;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
}

.btn-secondary:hover {
    background: #e5e7eb;
}

.form-card {
    background: white;
    max-width: 700px;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.form-group {
    margin-bottom: 22px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #374151;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
    box-sizing: border-box;
    font-family: inherit;
}

.form-group input:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #2563eb;
}

.form-group textarea {
    resize: vertical;
}

.form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 10px;
}

.btn-primary {
    border: none;
    background: #2563eb;
    color: white;
    padding: 11px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
}

.btn-primary:hover {
    background: #1d4ed8;
}

.btn-cancel {
    display: inline-block;
    padding: 11px 20px;
    background: #f3f4f6;
    color: #374151;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
}

.btn-cancel:hover {
    background: #e5e7eb;
}

</style>

{% endblock %}
