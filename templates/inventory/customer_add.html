
{% extends 'base.html' %}

{% block title %}Add Customer{% endblock %}

{% block page_heading %}Add Customer{% endblock %}

{% block content %}

<style>
    .customer-form-page {
        max-width: 850px;
        margin: 0 auto;
    }

    .form-header {
        margin-bottom: 24px;
    }

    .form-title {
        margin: 0;
        font-size: 28px;
        font-weight: 700;
        color: #111827;
    }

    .form-subtitle {
        margin-top: 6px;
        color: #6b7280;
        font-size: 14px;
    }

    .form-card {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 28px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .form-group.full-width {
        grid-column: 1 / -1;
    }

    .form-group label {
        color: #374151;
        font-size: 14px;
        font-weight: 600;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px #dbeafe;
    }

    .form-group textarea {
        min-height: 110px;
        resize: vertical;
    }

    .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 28px;
        padding-top: 22px;
        border-top: 1px solid #e5e7eb;
    }

    .btn {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        padding: 11px 18px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        border: none;
    }

    .btn-primary {
        background: #2563eb;
        color: #ffffff;
    }

    .btn-primary:hover {
        background: #1d4ed8;
    }

    .btn-secondary {
        background: #f3f4f6;
        color: #374151;
    }

    .btn-secondary:hover {
        background: #e5e7eb;
    }

    .required {
        color: #dc2626;
    }

    @media (max-width: 650px) {
        .form-grid {
            grid-template-columns: 1fr;
        }

        .form-group.full-width {
            grid-column: auto;
        }

        .form-card {
            padding: 20px;
        }
    }
</style>

<div class="customer-form-page">

    <div class="form-header">
        <h1 class="form-title">Add Customer</h1>
        <p class="form-subtitle">
            Enter the customer details below
        </p>
    </div>

    <div class="form-card">

        <form method="POST">
            {% csrf_token %}

            <div class="form-grid">

                <div class="form-group full-width">
                    <label for="name">
                        Customer Name <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter customer name"
                        maxlength="200"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter phone number"
                        maxlength="20"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter email address"
                    >
                </div>

                <div class="form-group full-width">
                    <label for="address">Address</label>

                    <textarea
                        id="address"
                        name="address"
                        placeholder="Enter customer address"
                    ></textarea>
                </div>

            </div>

            <div class="form-actions">

                <a href="{% url 'customers' %}" class="btn btn-secondary">
                    Cancel
                </a>

                <button type="submit" class="btn btn-primary">
                    Save Customer
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
